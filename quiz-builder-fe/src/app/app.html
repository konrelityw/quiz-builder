<div class="app-shell"
     [class.store-page]="isStore">
  <nav class="top-nav" aria-label="Main navigation"
       [class.hide-nav-bar]="isStore || (isPublicQuiz && !authApiService.isAuthenticated())">
    <a class="brand" routerLink="/quiz-builder">QuizBuilder</a>

    <div class="top-nav__end">
      <div class="top-nav-links">
        <a routerLink="/quiz-builder">Builder</a>
        <a routerLink="/quiz-builder/my">My Quizzes</a>
        @if (authApiService.isAuthenticated()) {
          <a routerLink="/quiz-builder/account">My account</a>
        }
        @if (!authApiService.isAuthenticated()) {
          <a routerLink="/login">Login</a>
        }
      </div>

      @if (authApiService.isAuthenticated()) {
        <button type="button" class="btn-secondary btn-sm" (click)="logout()">Logout</button>
      }
    </div>
  </nav>

  <main class="page-container">
    <router-outlet/>
  </main>
</div>
