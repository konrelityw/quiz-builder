<section class="auth-page">
  <span class="auth-page__badge">QuizBuilder</span>
  <h2>Set a new password</h2>

  <form [formGroup]="form" class="auth-form">
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" formControlName="password"/>

    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" autocomplete="new-password" formControlName="confirm"/>

    <button type="button" (click)="submit()" [disabled]="!token">Save password</button>
  </form>

  <p class="auth-switch">
    <a routerLink="/login">Back to login</a>
  </p>

  <p class="error">{{ errorMessage }}</p>
  <p class="request-status">{{ status }}</p>
</section>
