<section class="auth-page">
  <h2>Forgot password</h2>
  <p class="subtitle">If an account exists for this email, you will receive reset instructions.</p>

  <form [formGroup]="form" class="auth-form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" formControlName="email" />

    <button type="button" (click)="submit()">Send reset link</button>
  </form>

  <p class="auth-switch">
    <a routerLink="/login">Back to login</a>
  </p>

  <p class="error">{{ errorMessage }}</p>
  <p class="request-status">{{ status }}</p>
</section>
