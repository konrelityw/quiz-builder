<section class="auth-page">
  <span class="auth-page__badge">QuizBuilder</span>
  <h2>Create account</h2>
  <p class="subtitle">Start building interactive recommendation quizzes</p>

  <form [formGroup]="form" class="auth-form">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username" formControlName="username" />

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" formControlName="email" />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="new-password" formControlName="password" />

    <label for="confirm-password">Confirm password</label>
    <input
      id="confirm-password"
      type="password"
      autocomplete="new-password"
      formControlName="confirmPassword"
    />

    <button type="button" (click)="submit()">Register</button>
  </form>

  <p class="auth-switch">
    Already have an account?
    <a routerLink="/login">Login</a>
  </p>

  <p class="error">{{ errorMessage }}</p>
  <p class="request-status">{{ requestStatus }}</p>
</section>
